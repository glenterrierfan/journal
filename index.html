<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Training Log — Dog Training Journal</title>

<!--
  ============================================================
  SETUP: paste your own Supabase project values below.
  See SETUP.md (in the same download) for step-by-step instructions.
  ============================================================
-->
<script>
  window.SUPABASE_URL = "https://foddrbexzkbyrklzkphh.supabase.co.";
  window.SUPABASE_ANON_KEY = "sb_publishable_i_ELwj1uhxU_eYr2BO5FaA_hWPS5uu1";
</script>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Source+Sans+3:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');
  :root {
    --paper: #E7E2D2;
    --ink: #232B24;
    --moss: #3F5443;
    --moss-light: #6C8268;
    --rust: #B5592E;
    --teal: #3A6B72;
    --line: #b9b199;
    --paper-card: #EFEBDD;
  }
  body { margin: 0; background: var(--paper); font-family: 'Source Sans 3', sans-serif; }
  .display-font { font-family: 'Fraunces', serif; }
  .mono-font { font-family: 'IBM Plex Mono', monospace; }
  button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
    outline: 2px solid var(--teal); outline-offset: 2px;
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;
const supabase = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

/* ---------- tiny inline icon set (no external icon package needed) ---------- */
const Icon = ({ children, size = 16, ...props }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"
       strokeLinecap="round" strokeLinejoin="round" {...props}>{children}</svg>
);
const Plus = (p) => <Icon {...p}><line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" /></Icon>;
const Trash2 = (p) => <Icon {...p}><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6" /></Icon>;
const Pencil = (p) => <Icon {...p}><path d="M12 20h9" /><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" /></Icon>;
const Check = (p) => <Icon {...p}><path d="M20 6 9 17l-5-5" /></Icon>;
const X = (p) => <Icon {...p}><path d="M18 6 6 18M6 6l12 12" /></Icon>;
const ChevronDown = (p) => <Icon {...p}><path d="M6 9l6 6 6-6" /></Icon>;
const ChevronUp = (p) => <Icon {...p}><path d="M18 15l-6-6-6 6" /></Icon>;
const Compass = (p) => <Icon {...p}><circle cx="12" cy="12" r="9" /><path d="M15 9l-2 6-6 2 2-6z" /></Icon>;
const MapPin = (p) => <Icon {...p}><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 1 1 16 0Z" /><circle cx="12" cy="10" r="3" /></Icon>;
const Video = (p) => <Icon {...p}><rect x="2" y="6" width="14" height="12" rx="2" /><path d="M16 10l6-3v10l-6-3" /></Icon>;
const PawPrint = (p) => <Icon {...p}><circle cx="12" cy="15" r="4" /><circle cx="6" cy="9" r="1.6" /><circle cx="18" cy="9" r="1.6" /><circle cx="9" cy="5.5" r="1.4" /><circle cx="15" cy="5.5" r="1.4" /></Icon>;
const CircleIcon = (p) => <Icon {...p}><circle cx="12" cy="12" r="8" /></Icon>;

const TERMS = [
  { key: "long", label: "Long-term Aim", hint: "The horizon — where this dog is headed", ring: 3 },
  { key: "weekly", label: "Weekly Focus", hint: "This week's ground to cover", ring: 2 },
  { key: "daily", label: "Daily Waypoint", hint: "Today's step on the trail", ring: 1 },
];
const STATUSES = [
  { key: "in_progress", label: "In progress", color: "var(--teal)" },
  { key: "complete_maintain", label: "Complete – maintain", color: "var(--rust)" },
  { key: "complete", label: "Complete", color: "var(--moss)" },
];
const ACCENTS = ["#B5592E", "#3A6B72", "#8A6D3B", "#5C7A5E", "#7A4B5C"];
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const todayStr = () => new Date().toISOString().slice(0, 10);
const fmtDate = (d) => new Date(d + "T00:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });

/* ---------- Auth screen ---------- */
function AuthScreen({ onSignedIn }) {
  const [mode, setMode] = useState("signin");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [notice, setNotice] = useState("");
  const [busy, setBusy] = useState(false);

  async function submit(e) {
    e.preventDefault();
    setError(""); setNotice(""); setBusy(true);
    try {
      if (mode === "signup") {
        const { error } = await supabase.auth.signUp({ email, password });
        if (error) throw error;
        setNotice("Account created. Check your email to confirm, then sign in below (or sign in now if confirmation is off).");
        setMode("signin");
      } else {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) throw error;
        onSignedIn(data.session);
      }
    } catch (err) {
      setError(err.message || "Something went wrong.");
    } finally {
      setBusy(false);
    }
  }

  return (
    <div className="max-w-sm mx-auto px-5 pt-24">
      <div className="flex items-center gap-2" style={{ color: "var(--moss)" }}>
        <Compass size={22} />
        <span className="mono-font text-xs tracking-widest uppercase" style={{ color: "var(--teal)" }}>Field Journal</span>
      </div>
      <h1 className="display-font mt-1" style={{ fontSize: "2rem", color: "var(--ink)", fontWeight: 600 }}>Training Log</h1>
      <p className="text-sm mt-1 mb-6" style={{ color: "var(--moss-light)" }}>
        {mode === "signin" ? "Sign in to reach your journal from any device." : "Create your account — just for you, private to this journal."}
      </p>
      <form onSubmit={submit} className="space-y-2">
        <input type="email" required placeholder="Email" value={email} onChange={(e) => setEmail(e.target.value)}
          className="w-full px-3 py-2 rounded border text-sm" style={{ borderColor: "var(--line)" }} />
        <input type="password" required placeholder="Password" value={password} onChange={(e) => setPassword(e.target.value)}
          className="w-full px-3 py-2 rounded border text-sm" style={{ borderColor: "var(--line)" }} minLength={6} />
        {error && <p className="text-xs" style={{ color: "var(--rust)" }}>{error}</p>}
        {notice && <p className="text-xs" style={{ color: "var(--moss)" }}>{notice}</p>}
        <button disabled={busy} type="submit" className="w-full px-4 py-2 rounded text-sm text-white mt-1" style={{ background: "var(--moss)" }}>
          {busy ? "Please wait…" : mode === "signin" ? "Sign in" : "Create account"}
        </button>
      </form>
      <button
        onClick={() => { setMode(mode === "signin" ? "signup" : "signin"); setError(""); setNotice(""); }}
        className="text-xs mt-3 underline"
        style={{ color: "var(--teal)" }}
      >
        {mode === "signin" ? "First time here? Create an account" : "Already have an account? Sign in"}
      </button>
    </div>
  );
}

/* ---------- Main app ---------- */
function TrainingLogApp({ session, onSignOut }) {
  const [dogs, setDogs] = useState([]);
  const [plans, setPlans] = useState([]);
  const [goals, setGoals] = useState([]);
  const [sessions, setSessions] = useState([]);
  const [maintenance, setMaintenance] = useState([]);
  const [activeDogId, setActiveDogId] = useState(null);
  const [view, setView] = useState("profile");
  const [loaded, setLoaded] = useState(false);
  const [storageError, setStorageError] = useState(false);
  const skipSave = useRef(true);

  const [showAddDog, setShowAddDog] = useState(false);
  const [newDogName, setNewDogName] = useState("");
  const [newDogBreed, setNewDogBreed] = useState("");

  const [showEditProfile, setShowEditProfile] = useState(false);
  const [profPhoto, setProfPhoto] = useState("");
  const [profDob, setProfDob] = useState("");
  const [profMicrochip, setProfMicrochip] = useState("");
  const [profVetName, setProfVetName] = useState("");
  const [profVetPhone, setProfVetPhone] = useState("");
  const [profVetAddress, setProfVetAddress] = useState("");

  const [showImport, setShowImport] = useState(false);
  const [importText, setImportText] = useState("");
  const [importError, setImportError] = useState("");
  const [importSuccess, setImportSuccess] = useState("");

  const [showAddPlan, setShowAddPlan] = useState(false);
  const [newPlanTitle, setNewPlanTitle] = useState("");
  const [expandedPlan, setExpandedPlan] = useState(null);
  const [editingPlanId, setEditingPlanId] = useState(null);
  const [editPlanTitle, setEditPlanTitle] = useState("");

  const [openGoalForm, setOpenGoalForm] = useState(null);
  const [goalTitle, setGoalTitle] = useState("");
  const [goalDetail, setGoalDetail] = useState("");
  const [editingGoalId, setEditingGoalId] = useState(null);

  const [showSessionForm, setShowSessionForm] = useState(false);
  const [editingSessionId, setEditingSessionId] = useState(null);
  const [sDate, setSDate] = useState(todayStr());
  const [sGoalId, setSGoalId] = useState("");
  const [sSuccessCriteria, setSSuccessCriteria] = useState("");
  const [sNotes, setSNotes] = useState("");
  const [sVideo, setSVideo] = useState("");
  const [sVideoNote, setSVideoNote] = useState("");
  const [sTakeaways, setSTakeaways] = useState("");
  const [sDistance, setSDistance] = useState("");
  const [sDuration, setSDuration] = useState("");
  const [sDistraction, setSDistraction] = useState("");
  const [sReps, setSReps] = useState("");
  const [sReinforcements, setSReinforcements] = useState("");
  const [expandedSession, setExpandedSession] = useState(null);

  const userId = session.user.id;

  useEffect(() => {
    (async () => {
      try {
        const { data, error } = await supabase.from("planner_state").select("data").eq("user_id", userId).maybeSingle();
        if (error) throw error;
        if (data && data.data) {
          const d = data.data;
          setDogs(d.dogs || []);
          setPlans(d.plans || []);
          setGoals(d.goals || []);
          setSessions(d.sessions || []);
          setMaintenance(d.maintenance || []);
          if (d.dogs && d.dogs.length) setActiveDogId(d.dogs[0].id);
        } else {
          await supabase.from("planner_state").insert({ user_id: userId, data: { dogs: [], plans: [], goals: [], sessions: [], maintenance: [] } });
        }
      } catch (e) {
        console.error(e);
      } finally {
        setLoaded(true);
        setTimeout(() => { skipSave.current = false; }, 0);
      }
    })();
  }, []);

  useEffect(() => {
    if (!loaded || skipSave.current) return;
    (async () => {
      const { error } = await supabase.from("planner_state")
        .upsert({ user_id: userId, data: { dogs, plans, goals, sessions, maintenance }, updated_at: new Date().toISOString() });
      setStorageError(!!error);
    })();
  }, [dogs, plans, goals, sessions, maintenance, loaded]);

  const activeDog = dogs.find((d) => d.id === activeDogId) || null;
  const dogPlans = plans.filter((p) => p.dogId === activeDogId);
  const dogMaintenance = maintenance.filter((m) => m.dogId === activeDogId);
  const planGoals = (planId, term) => goals.filter((g) => g.planId === planId && g.term === term);
  const dogSessions = sessions.filter((s) => s.dogId === activeDogId).sort((a, b) => (a.date < b.date ? 1 : -1));
  const dogSessionsAsc = [...dogSessions].sort((a, b) => (a.date < b.date ? -1 : 1));
  const allDogGoalsForSelect = goals.filter((g) => g.dogId === activeDogId);

  function addDog() {
    const name = newDogName.trim();
    if (!name) return;
    const id = uid();
    const accent = ACCENTS[dogs.length % ACCENTS.length];
    setDogs([...dogs, { id, name, breed: newDogBreed.trim(), accent }]);
    setActiveDogId(id);
    setNewDogName(""); setNewDogBreed(""); setShowAddDog(false);
  }

  function removeDog(id) {
    setDogs(dogs.filter((d) => d.id !== id));
    setPlans(plans.filter((p) => p.dogId !== id));
    setGoals(goals.filter((g) => g.dogId !== id));
    setSessions(sessions.filter((s) => s.dogId !== id));
    setMaintenance(maintenance.filter((m) => m.dogId !== id));
    if (activeDogId === id) {
      const remaining = dogs.filter((d) => d.id !== id);
      setActiveDogId(remaining.length ? remaining[0].id : null);
    }
  }

  function openEditProfile() {
    if (!activeDog) return;
    setProfPhoto(activeDog.photoDataUrl || "");
    setProfDob(activeDog.dob || "");
    setProfMicrochip(activeDog.microchip || "");
    setProfVetName(activeDog.vetName || "");
    setProfVetPhone(activeDog.vetPhone || "");
    setProfVetAddress(activeDog.vetAddress || "");
    setShowEditProfile(true);
  }

  function handlePhotoFile(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    if (file.size > 2 * 1024 * 1024) {
      alert("That photo is a bit large — try one under 2MB so it saves reliably.");
      return;
    }
    const reader = new FileReader();
    reader.onload = () => setProfPhoto(reader.result);
    reader.readAsDataURL(file);
  }

  function saveProfile() {
    if (!activeDog) return;
    setDogs(dogs.map((d) => (d.id === activeDog.id
      ? { ...d, photoDataUrl: profPhoto, dob: profDob, microchip: profMicrochip.trim(), vetName: profVetName.trim(), vetPhone: profVetPhone.trim(), vetAddress: profVetAddress.trim() }
      : d)));
    setShowEditProfile(false);
  }

  function runImport() {
    setImportError(""); setImportSuccess("");
    let parsed;
    try {
      parsed = JSON.parse(importText);
    } catch (e) {
      setImportError("That doesn't look like valid plan text — check nothing got cut off when you pasted it.");
      return;
    }
    if (!parsed || typeof parsed !== "object" || !parsed.dog || !parsed.dog.name) {
      setImportError('Missing a dog name — check the plan text includes a "dog" section.');
      return;
    }
    const validTerms = ["long", "weekly", "daily"];
    const goalsIn = Array.isArray(parsed.goals) ? parsed.goals : [];
    const badGoal = goalsIn.find((g) => !g || !g.title || !validTerms.includes(g.term));
    if (badGoal) {
      setImportError("One of the goals is missing a title or has an unrecognised term (must be long, weekly, or daily).");
      return;
    }
    const dogId = uid();
    const planId = uid();
    const accent = ACCENTS[dogs.length % ACCENTS.length];
    const newDog = { id: dogId, name: String(parsed.dog.name).trim(), breed: String(parsed.dog.breed || "").trim(), accent };
    const planTitle = (parsed.plan && parsed.plan.title) ? String(parsed.plan.title).trim() : "Imported plan";
    const newPlan = { id: planId, dogId, title: planTitle, status: "in_progress", createdAt: Date.now() };
    const newGoals = goalsIn.map((g) => ({
      id: uid(), dogId, planId, term: g.term, title: String(g.title).trim(), detail: String(g.detail || "").trim(),
      done: false, createdAt: Date.now(),
    }));
    setDogs([...dogs, newDog]);
    setPlans([...plans, newPlan]);
    setGoals([...goals, ...newGoals]);
    setActiveDogId(dogId);
    setExpandedPlan(planId);
    setImportSuccess(`Added ${newDog.name} with plan "${planTitle}" and ${newGoals.length} goal${newGoals.length === 1 ? "" : "s"}.`);
    setImportText("");
    setTimeout(() => { setShowImport(false); setImportSuccess(""); }, 1500);
  }

  function addPlan() {
    const title = newPlanTitle.trim();
    if (!title || !activeDogId) return;
    const id = uid();
    setPlans([...plans, { id, dogId: activeDogId, title, status: "in_progress", createdAt: Date.now() }]);
    setExpandedPlan(id);
    setNewPlanTitle("");
    setShowAddPlan(false);
  }

  function removePlan(id) {
    setPlans(plans.filter((p) => p.id !== id));
    setGoals(goals.filter((g) => g.planId !== id));
    setMaintenance(maintenance.filter((m) => m.planId !== id));
    if (expandedPlan === id) setExpandedPlan(null);
  }

  function startEditPlan(p) { setEditingPlanId(p.id); setEditPlanTitle(p.title); }

  function saveEditPlan() {
    const title = editPlanTitle.trim();
    if (!title) return;
    setPlans(plans.map((p) => (p.id === editingPlanId ? { ...p, title } : p)));
    setMaintenance(maintenance.map((m) => (m.planId === editingPlanId ? { ...m, title } : m)));
    setEditingPlanId(null);
    setEditPlanTitle("");
  }

  function setPlanStatus(plan, status) {
    setPlans(plans.map((p) => (p.id === plan.id ? { ...p, status } : p)));
    if (status === "complete_maintain") {
      const exists = maintenance.some((m) => m.planId === plan.id);
      if (!exists) {
        setMaintenance([...maintenance, { id: uid(), dogId: plan.dogId, planId: plan.id, title: plan.title, createdAt: Date.now() }]);
      }
    } else {
      setMaintenance(maintenance.filter((m) => m.planId !== plan.id));
    }
  }

  function removeMaintenanceItem(id) { setMaintenance(maintenance.filter((m) => m.id !== id)); }

  function openNewGoalForm(planId, term) { setEditingGoalId(null); setGoalTitle(""); setGoalDetail(""); setOpenGoalForm(`${planId}:${term}`); }
  function openEditGoalForm(g) { setEditingGoalId(g.id); setGoalTitle(g.title); setGoalDetail(g.detail || ""); setOpenGoalForm(`${g.planId}:${g.term}`); }
  function saveGoal(planId, term) {
    const title = goalTitle.trim();
    if (!title) return;
    if (editingGoalId) {
      setGoals(goals.map((g) => (g.id === editingGoalId ? { ...g, title, detail: goalDetail.trim() } : g)));
    } else {
      setGoals([...goals, { id: uid(), dogId: activeDogId, planId, term, title, detail: goalDetail.trim(), done: false, createdAt: Date.now() }]);
    }
    setOpenGoalForm(null); setEditingGoalId(null); setGoalTitle(""); setGoalDetail("");
  }
  function toggleGoalDone(id) { setGoals(goals.map((g) => (g.id === id ? { ...g, done: !g.done } : g))); }
  function deleteGoal(id) {
    setGoals(goals.filter((g) => g.id !== id));
    setSessions(sessions.map((s) => (s.goalId === id ? { ...s, goalId: "" } : s)));
  }

  function resetSessionForm() {
    setSDate(todayStr()); setSGoalId(""); setSNotes(""); setSVideo(""); setSVideoNote(""); setSTakeaways(""); setSSuccessCriteria("");
    setSDistance(""); setSDuration(""); setSDistraction(""); setSReps(""); setSReinforcements("");
    setEditingSessionId(null); setShowSessionForm(false);
  }
  function openEditSession(s) {
    setEditingSessionId(s.id); setSDate(s.date); setSGoalId(s.goalId || ""); setSNotes(s.notes || "");
    setSVideo(s.videoUrl || ""); setSVideoNote(s.videoNote || ""); setSTakeaways(s.takeaways || ""); setSSuccessCriteria(s.successCriteria || "");
    setSDistance(s.distance || ""); setSDuration(s.duration || ""); setSDistraction(s.distraction || "");
    setSReps(s.reps || ""); setSReinforcements(s.reinforcements || ""); setShowSessionForm(true);
  }
  function saveSession() {
    if (!sDate) return;
    const criteriaFields = {
      successCriteria: sSuccessCriteria.trim(),
      distance: sDistance.trim(), duration: sDuration, distraction: sDistraction,
      reps: sReps, reinforcements: sReinforcements,
    };
    if (editingSessionId) {
      setSessions(sessions.map((s) => (s.id === editingSessionId
        ? { ...s, date: sDate, goalId: sGoalId, notes: sNotes.trim(), videoUrl: sVideo.trim(), videoNote: sVideoNote.trim(), takeaways: sTakeaways.trim(), ...criteriaFields }
        : s)));
    } else {
      setSessions([...sessions, {
        id: uid(), dogId: activeDogId, date: sDate, goalId: sGoalId, notes: sNotes.trim(),
        videoUrl: sVideo.trim(), videoNote: sVideoNote.trim(), takeaways: sTakeaways.trim(), ...criteriaFields, createdAt: Date.now(),
      }]);
    }
    resetSessionForm();
  }
  function deleteSession(id) { setSessions(sessions.filter((s) => s.id !== id)); }

  return (
    <div style={{ background: "var(--paper)", minHeight: "100vh" }}>
      <header className="border-b" style={{ borderColor: "var(--line)" }}>
        <div className="max-w-3xl mx-auto px-5 pt-8 pb-6 flex items-start justify-between">
          <div>
            <div className="flex items-center gap-2" style={{ color: "var(--moss)" }}>
              <Compass size={22} />
              <span className="mono-font text-xs tracking-widest uppercase" style={{ color: "var(--teal)" }}>Field Journal</span>
            </div>
            <h1 className="display-font mt-1" style={{ fontSize: "2.1rem", color: "var(--ink)", fontWeight: 600 }}>Training Log</h1>
            <p className="mt-1 text-sm" style={{ color: "var(--moss-light)" }}>Training plans, goals, and every session logged along the way.</p>
          </div>
          <button onClick={onSignOut} className="text-xs underline shrink-0 mt-1" style={{ color: "var(--moss-light)" }}>Sign out</button>
        </div>
      </header>

      <main className="max-w-3xl mx-auto px-5 pb-24">
        <div className="flex flex-wrap items-center gap-2 pt-6">
          {dogs.map((d) => (
            <button key={d.id} onClick={() => setActiveDogId(d.id)}
              className="px-4 py-2 rounded-full text-sm flex items-center gap-2"
              style={{ background: activeDogId === d.id ? d.accent : "var(--paper-card)", color: activeDogId === d.id ? "#fff" : "var(--ink)",
                       border: `1.5px solid ${activeDogId === d.id ? d.accent : "var(--line)"}` }}>
              <PawPrint size={14} /> {d.name}
            </button>
          ))}
          <button onClick={() => setShowAddDog(true)} className="px-3 py-2 rounded-full text-sm flex items-center gap-1 border"
            style={{ borderColor: "var(--moss)", color: "var(--moss)" }}>
            <Plus size={14} /> Add dog
          </button>
          <button onClick={() => { setShowImport(true); setImportError(""); setImportSuccess(""); }} className="px-3 py-2 rounded-full text-sm flex items-center gap-1 border"
            style={{ borderColor: "var(--teal)", color: "var(--teal)" }}>
            <MapPin size={14} /> Import plan
          </button>
        </div>

        {showImport && (
          <div className="mt-4 p-4 rounded-lg" style={{ background: "var(--paper-card)", border: "1px solid var(--line)" }}>
            <p className="text-sm mb-1" style={{ color: "var(--ink)" }}>Paste a plan below to create a new dog with a training plan and goals pre-filled.</p>
            <p className="text-xs mb-2" style={{ color: "var(--moss-light)" }}>This always adds a new dog — it won't merge into one that already exists.</p>
            <textarea value={importText} onChange={(e) => setImportText(e.target.value)}
              placeholder='{"dog":{"name":"Wanda","breed":"..."},"plan":{"title":"Crate settling"},"goals":[{"term":"long","title":"...","detail":"..."}]}'
              rows={6} className="w-full px-3 py-2 rounded border text-xs mono-font" style={{ borderColor: "var(--line)", background: "#fff" }} />
            {importError && <p className="text-xs mt-2" style={{ color: "var(--rust)" }}>{importError}</p>}
            {importSuccess && <p className="text-xs mt-2" style={{ color: "var(--moss)" }}>{importSuccess}</p>}
            <div className="flex gap-2 mt-3">
              <button onClick={runImport} className="px-4 py-1.5 rounded text-sm text-white" style={{ background: "var(--teal)" }}>Import</button>
              <button onClick={() => { setShowImport(false); setImportText(""); setImportError(""); setImportSuccess(""); }} className="px-4 py-1.5 rounded text-sm" style={{ color: "var(--moss-light)" }}>Cancel</button>
            </div>
          </div>
        )}

        {showAddDog && (
          <div className="mt-4 p-4 rounded-lg" style={{ background: "var(--paper-card)", border: "1px solid var(--line)" }}>
            <div className="flex flex-col sm:flex-row gap-2">
              <input type="text" placeholder="Dog's name" value={newDogName} onChange={(e) => setNewDogName(e.target.value)}
                className="flex-1 px-3 py-2 rounded border text-sm" style={{ borderColor: "var(--line)", background: "#fff" }} />
              <input type="text" placeholder="Breed (optional)" value={newDogBreed} onChange={(e) => setNewDogBreed(e.target.value)}
                className="flex-1 px-3 py-2 rounded border text-sm" style={{ borderColor: "var(--line)", background: "#fff" }} />
            </div>
            <div className="flex gap-2 mt-3">
              <button onClick={addDog} className="px-4 py-1.5 rounded text-sm text-white" style={{ background: "var(--moss)" }}>Add</button>
              <button onClick={() => { setShowAddDog(false); setNewDogName(""); setNewDogBreed(""); }} className="px-4 py-1.5 rounded text-sm" style={{ color: "var(--moss-light)" }}>Cancel</button>
            </div>
          </div>
        )}

        {!activeDog && dogs.length === 0 && (
          <div className="mt-10 text-center py-14 rounded-lg" style={{ border: "1px dashed var(--line)" }}>
            <Compass size={28} className="mx-auto mb-3" style={{ color: "var(--moss-light)" }} />
            <p className="display-font text-lg" style={{ color: "var(--ink)" }}>No dogs on the map yet</p>
            <p className="text-sm mt-1" style={{ color: "var(--moss-light)" }}>Add your first dog to start plotting plans and sessions.</p>
          </div>
        )}

        {activeDog && (
          <React.Fragment>
            <div className="flex items-center justify-between mt-6 mb-2">
              <div className="flex items-center gap-2">
                <span className="display-font text-lg" style={{ color: "var(--ink)" }}>{activeDog.name}</span>
                {activeDog.breed && <span className="mono-font text-xs px-2 py-0.5 rounded" style={{ background: "var(--paper-card)", color: "var(--moss-light)" }}>{activeDog.breed}</span>}
              </div>
              <button onClick={() => removeDog(activeDog.id)} className="text-xs flex items-center gap-1" style={{ color: "var(--rust)" }}>
                <Trash2 size={13} /> Remove dog
              </button>
            </div>

            <div className="flex gap-1 mb-6 rounded-full p-1 w-fit" style={{ background: "var(--paper-card)" }}>
              {[{ k: "profile", label: "Profile" }, { k: "goals", label: "Training Plans" }, { k: "sessions", label: "Sessions" }].map((t) => (
                <button key={t.k} onClick={() => setView(t.k)} className="px-4 py-1.5 rounded-full text-sm"
                  style={{ background: view === t.k ? "var(--moss)" : "transparent", color: view === t.k ? "#fff" : "var(--ink)" }}>
                  {t.label}
                </button>
              ))}
            </div>

            {view === "profile" && (
              <div className="rounded-lg p-4" style={{ background: "var(--paper-card)", border: "1px solid var(--line)" }}>
                <div className="flex flex-col sm:flex-row gap-4">
                  <div className="w-full sm:w-40 h-40 rounded-lg shrink-0 flex items-center justify-center overflow-hidden" style={{ background: "#fff", border: "1px solid var(--line)" }}>
                    {activeDog.photoDataUrl ? (
                      <img src={activeDog.photoDataUrl} alt={activeDog.name} className="w-full h-full object-cover" />
                    ) : (
                      <PawPrint size={36} style={{ color: "var(--line)" }} />
                    )}
                  </div>
                  <div className="flex-1 min-w-0">
                    <div className="flex items-center justify-between">
                      <h2 className="display-font" style={{ fontSize: "1.3rem", color: "var(--ink)" }}>{activeDog.name}</h2>
                      <button onClick={openEditProfile} className="text-xs flex items-center gap-1 px-2.5 py-1.5 rounded-full shrink-0" style={{ background: "var(--moss)", color: "#fff" }}>
                        <Pencil size={12} /> Edit
                      </button>
                    </div>
                    {activeDog.breed && <p className="text-sm mt-0.5" style={{ color: "var(--moss-light)" }}>{activeDog.breed}</p>}
                    <dl className="grid grid-cols-2 gap-x-3 gap-y-2 mt-4 text-sm">
                      <div>
                        <dt className="text-xs mono-font" style={{ color: "var(--moss-light)" }}>Date of birth</dt>
                        <dd style={{ color: "var(--ink)" }}>{activeDog.dob ? fmtDate(activeDog.dob) : "—"}</dd>
                      </div>
                      <div>
                        <dt className="text-xs mono-font" style={{ color: "var(--moss-light)" }}>Microchip number</dt>
                        <dd style={{ color: "var(--ink)" }}>{activeDog.microchip || "—"}</dd>
                      </div>
                      <div className="col-span-2">
                        <dt className="text-xs mono-font" style={{ color: "var(--moss-light)" }}>Vet practice</dt>
                        <dd style={{ color: "var(--ink)" }}>{activeDog.vetName || "—"}</dd>
                      </div>
                      <div>
                        <dt className="text-xs mono-font" style={{ color: "var(--moss-light)" }}>Vet phone</dt>
                        <dd style={{ color: "var(--ink)" }}>{activeDog.vetPhone || "—"}</dd>
                      </div>
                      <div className="col-span-2">
                        <dt className="text-xs mono-font" style={{ color: "var(--moss-light)" }}>Vet address</dt>
                        <dd style={{ color: "var(--ink)" }}>{activeDog.vetAddress || "—"}</dd>
                      </div>
                    </dl>
                  </div>
                </div>

                {showEditProfile && (
                  <div className="mt-4 p-3 rounded" style={{ background: "#fff", border: "1px solid var(--line)" }}>
                    <label className="text-xs mono-font" style={{ color: "var(--moss-light)" }}>Photo</label>
                    <input type="file" accept="image/*" onChange={handlePhotoFile} className="w-full text-sm mt-1 mb-3" />
                    <div className="grid sm:grid-cols-2 gap-2 mb-2">
                      <div>
                        <label className="text-xs mono-font" style={{ color: "var(--moss-light)" }}>Date of birth</label>
                        <input type="date" value={profDob} onChange={(e) => setProfDob(e.target.value)} className="w-full px-3 py-2 rounded border text-sm mt-1" style={{ borderColor: "var(--line)" }} />
                      </div>
                      <div>
                        <label className="text-xs mono-font" style={{ color: "var(--moss-light)" }}>Microchip number</label>
                        <input type="text" value={profMicrochip} onChange={(e) => setProfMicrochip(e.target.value)} className="w-full px-3 py-2 rounded border text-sm mt-1" style={{ borderColor: "var(--line)" }} />
                      </div>
                    </div>
                    <label className="text-xs mono-font" style={{ color: "var(--moss-light)" }}>Vet practice name</label>
                    <input type="text" value={profVetName} onChange={(e) => setProfVetName(e.target.value)} className="w-full px-3 py-2 rounded border text-sm mt-1 mb-2" style={{ borderColor: "var(--line)" }} />
                    <label className="text-xs mono-font" style={{ color: "var(--moss-light)" }}>Vet phone</label>
                    <input type="text" value={profVetPhone} onChange={(e) => setProfVetPhone(e.target.value)} className="w-full px-3 py-2 rounded border text-sm mt-1 mb-2" style={{ borderColor: "var(--line)" }} />
                    <label className="text-xs mono-font" style={{ color: "var(--moss-light)" }}>Vet address</label>
                    <textarea value={profVetAddress} onChange={(e) => setProfVetAddress(e.target.value)} rows={2} className="w-full px-3 py-2 rounded border text-sm mt-1 mb-3" style={{ borderColor: "var(--line)" }} />
                    <div className="flex gap-2">
                      <button onClick={saveProfile} className="px-4 py-1.5 rounded text-sm text-white" style={{ background: "var(--moss)" }}>
                        <Check size={13} className="inline mr-1" /> Save
                      </button>
                      <button onClick={() => setShowEditProfile(false)} className="px-4 py-1.5 rounded text-sm" style={{ color: "var(--moss-light)" }}>Cancel</button>
                    </div>
                  </div>
                )}
              </div>
            )}

            {view === "goals" && (
              <div className="space-y-5">
                {dogMaintenance.length > 0 && (
                  <div className="rounded-lg p-4" style={{ background: "#fff", border: "2px dashed var(--rust)" }}>
                    <h3 className="display-font" style={{ fontSize: "1.05rem", color: "var(--ink)" }}>Weekly Maintenance</h3>
                    <p className="text-xs mt-0.5 mb-2" style={{ color: "var(--moss-light)" }}>Skills that are learned — keep them ticking over with occasional practice.</p>
                    <ul className="space-y-1.5">
                      {dogMaintenance.map((m) => (
                        <li key={m.id} className="flex items-center justify-between gap-2 p-2 rounded" style={{ background: "var(--paper-card)" }}>
                          <span className="text-sm" style={{ color: "var(--ink)" }}>{m.title}</span>
                          <button onClick={() => removeMaintenanceItem(m.id)} title="Remove from maintenance"><Trash2 size={13} style={{ color: "var(--rust)" }} /></button>
                        </li>
                      ))}
                    </ul>
                  </div>
                )}

                <div className="flex items-center justify-between">
                  <h2 className="display-font" style={{ fontSize: "1.15rem", color: "var(--ink)" }}>Training Plans</h2>
                  <button onClick={() => setShowAddPlan(true)} className="text-xs flex items-center gap-1 px-2.5 py-1.5 rounded-full" style={{ background: "var(--moss)", color: "#fff" }}>
                    <Plus size={12} /> New plan
                  </button>
                </div>

                {showAddPlan && (
                  <div className="p-3 rounded" style={{ background: "var(--paper-card)", border: "1px solid var(--line)" }}>
                    <input type="text" placeholder="Plan title, e.g. Crate settling" value={newPlanTitle} onChange={(e) => setNewPlanTitle(e.target.value)}
                      className="w-full px-3 py-2 rounded border text-sm mb-2" style={{ borderColor: "var(--line)" }} />
                    <div className="flex gap-2">
                      <button onClick={addPlan} className="px-3 py-1.5 rounded text-xs text-white" style={{ background: "var(--moss)" }}>
                        <Check size={12} className="inline mr-1" /> Create
                      </button>
                      <button onClick={() => { setShowAddPlan(false); setNewPlanTitle(""); }} className="px-3 py-1.5 rounded text-xs" style={{ color: "var(--moss-light)" }}>Cancel</button>
                    </div>
                  </div>
                )}

                {dogPlans.length === 0 && !showAddPlan && (
                  <div className="text-center py-10 rounded-lg" style={{ border: "1px dashed var(--line)" }}>
                    <p className="text-sm" style={{ color: "var(--moss-light)" }}>No training plans yet for {activeDog.name}.</p>
                  </div>
                )}

                {dogPlans.map((plan) => {
                  const statusInfo = STATUSES.find((s) => s.key === plan.status) || STATUSES[0];
                  const isExpanded = expandedPlan === plan.id;
                  return (
                    <div key={plan.id} className="rounded-lg" style={{ background: "var(--paper-card)", border: "1px solid var(--line)" }}>
                      <div className="p-3 flex items-center gap-2">
                        <button onClick={() => setExpandedPlan(isExpanded ? null : plan.id)} className="shrink-0">
                          {isExpanded ? <ChevronUp size={16} /> : <ChevronDown size={16} />}
                        </button>
                        <div className="flex-1 min-w-0">
                          {editingPlanId === plan.id ? (
                            <div className="flex gap-2">
                              <input type="text" value={editPlanTitle} onChange={(e) => setEditPlanTitle(e.target.value)}
                                className="flex-1 px-2 py-1 rounded border text-sm" style={{ borderColor: "var(--line)" }} />
                              <button onClick={saveEditPlan}><Check size={15} style={{ color: "var(--moss)" }} /></button>
                              <button onClick={() => setEditingPlanId(null)}><X size={15} style={{ color: "var(--moss-light)" }} /></button>
                            </div>
                          ) : (
                            <p className="display-font truncate" style={{ fontSize: "1rem", color: "var(--ink)" }}>{plan.title}</p>
                          )}
                        </div>
                        <select value={plan.status} onChange={(e) => setPlanStatus(plan, e.target.value)}
                          className="text-xs px-2 py-1 rounded-full border shrink-0"
                          style={{ borderColor: statusInfo.color, color: statusInfo.color, background: "#fff" }}>
                          {STATUSES.map((s) => <option key={s.key} value={s.key}>{s.label}</option>)}
                        </select>
                        <button onClick={() => startEditPlan(plan)} title="Rename plan"><Pencil size={13} style={{ color: "var(--teal)" }} /></button>
                        <button onClick={() => removePlan(plan.id)} title="Delete plan"><Trash2 size={13} style={{ color: "var(--rust)" }} /></button>
                      </div>

                      {isExpanded && (
                        <div className="px-3 pb-3 space-y-3">
                          {TERMS.map((t) => (
                            <div key={t.key} className="rounded p-3" style={{ background: "#fff", border: `${t.ring}px solid var(--moss)` }}>
                              <div className="flex items-center justify-between">
                                <div>
                                  <h4 className="display-font" style={{ fontSize: "0.95rem", color: "var(--ink)" }}>{t.label}</h4>
                                  <p className="text-xs mt-0.5" style={{ color: "var(--moss-light)" }}>{t.hint}</p>
                                </div>
                                <button onClick={() => openNewGoalForm(plan.id, t.key)} className="text-xs flex items-center gap-1 px-2.5 py-1.5 rounded-full" style={{ background: "var(--moss)", color: "#fff" }}>
                                  <Plus size={12} /> Add
                                </button>
                              </div>

                              {openGoalForm === `${plan.id}:${t.key}` && (
                                <div className="mt-3 p-3 rounded" style={{ background: "var(--paper-card)", border: "1px solid var(--line)" }}>
                                  <input type="text" placeholder="Goal title" value={goalTitle} onChange={(e) => setGoalTitle(e.target.value)}
                                    className="w-full px-3 py-2 rounded border text-sm mb-2" style={{ borderColor: "var(--line)" }} />
                                  <textarea placeholder="Detail (optional)" value={goalDetail} onChange={(e) => setGoalDetail(e.target.value)} rows={2}
                                    className="w-full px-3 py-2 rounded border text-sm mb-2" style={{ borderColor: "var(--line)" }} />
                                  <div className="flex gap-2">
                                    <button onClick={() => saveGoal(plan.id, t.key)} className="px-3 py-1.5 rounded text-xs text-white" style={{ background: "var(--moss)" }}>
                                      <Check size={12} className="inline mr-1" /> Save
                                    </button>
                                    <button onClick={() => { setOpenGoalForm(null); setEditingGoalId(null); }} className="px-3 py-1.5 rounded text-xs" style={{ color: "var(--moss-light)" }}>Cancel</button>
                                  </div>
                                </div>
                              )}

                              <ul className="mt-3 space-y-2">
                                {planGoals(plan.id, t.key).length === 0 && openGoalForm !== `${plan.id}:${t.key}` && (
                                  <li className="text-sm italic" style={{ color: "var(--moss-light)" }}>Nothing set for this tier yet.</li>
                                )}
                                {planGoals(plan.id, t.key).map((g) => (
                                  <li key={g.id} className="flex items-start gap-2 p-2 rounded" style={{ background: "var(--paper-card)" }}>
                                    <button onClick={() => toggleGoalDone(g.id)} className="mt-0.5 shrink-0">
                                      {g.done ? <Check size={16} style={{ color: "var(--moss)" }} /> : <CircleIcon size={16} style={{ color: "var(--line)" }} />}
                                    </button>
                                    <div className="flex-1 min-w-0">
                                      <p className="text-sm" style={{ color: "var(--ink)", textDecoration: g.done ? "line-through" : "none", opacity: g.done ? 0.55 : 1 }}>{g.title}</p>
                                      {g.detail && <p className="text-xs mt-0.5" style={{ color: "var(--moss-light)" }}>{g.detail}</p>}
                                    </div>
                                    <button onClick={() => openEditGoalForm(g)}><Pencil size={13} style={{ color: "var(--teal)" }} /></button>
                                    <button onClick={() => deleteGoal(g.id)}><Trash2 size={13} style={{ color: "var(--rust)" }} /></button>
                                  </li>
                                ))}
                              </ul>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            )}

            {view === "sessions" && (
              <div>
                <div className="flex justify-end mb-4">
                  <button onClick={() => { resetSessionForm(); setShowSessionForm(true); }} className="px-4 py-2 rounded-full text-sm flex items-center gap-1.5 text-white" style={{ background: "var(--rust)" }}>
                    <Plus size={14} /> Log a session
                  </button>
                </div>

                {showSessionForm && (
                  <div className="mb-6 p-4 rounded-lg" style={{ background: "var(--paper-card)", border: "1px solid var(--line)" }}>
                    <div className="grid sm:grid-cols-2 gap-2 mb-2">
                      <div>
                        <label className="text-xs mono-font" style={{ color: "var(--moss-light)" }}>Date</label>
                        <input type="date" value={sDate} onChange={(e) => setSDate(e.target.value)} className="w-full px-3 py-2 rounded border text-sm mt-1" style={{ borderColor: "var(--line)" }} />
                      </div>
                      <div>
                        <label className="text-xs mono-font" style={{ color: "var(--moss-light)" }}>Linked goal (optional)</label>
                        <select value={sGoalId} onChange={(e) => setSGoalId(e.target.value)} className="w-full px-3 py-2 rounded border text-sm mt-1" style={{ borderColor: "var(--line)" }}>
                          <option value="">No goal linked</option>
                          {allDogGoalsForSelect.map((g) => {
                            const plan = plans.find((p) => p.id === g.planId);
                            return <option key={g.id} value={g.id}>{plan ? `${plan.title} — ` : ""}{TERMS.find((t) => t.key === g.term)?.label}: {g.title}</option>;
                          })}
                        </select>
                      </div>
                    </div>

                    <div className="mb-3 p-2.5 rounded" style={{ background: "#fff", border: "1.5px solid var(--rust)" }}>
                      <label className="text-xs mono-font uppercase tracking-wide" style={{ color: "var(--rust)" }}>Success criteria — set this before you start</label>
                      <input type="text" value={sSuccessCriteria} onChange={(e) => setSSuccessCriteria(e.target.value)}
                        placeholder="e.g. Recall at 15m with one dog as distraction, 4 out of 5 reps"
                        className="w-full px-3 py-2 rounded border text-sm mt-1.5" style={{ borderColor: "var(--line)" }} />
                    </div>

                    <label className="text-xs mono-font" style={{ color: "var(--moss-light)" }}>Session notes</label>
                    <textarea value={sNotes} onChange={(e) => setSNotes(e.target.value)} placeholder="What did you work on, how did it go..." rows={3}
                      className="w-full px-3 py-2 rounded border text-sm mt-1 mb-2" style={{ borderColor: "var(--line)" }} />

                    <p className="text-xs mono-font uppercase tracking-wide mb-1.5 mt-1" style={{ color: "var(--teal)" }}>Criteria &amp; rate (optional)</p>
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-3">
                      <div>
                        <label className="text-xs mono-font" style={{ color: "var(--moss-light)" }}>Distance</label>
                        <input type="text" value={sDistance} onChange={(e) => setSDistance(e.target.value)} placeholder="e.g. 10m"
                          className="w-full px-2 py-1.5 rounded border text-sm mt-1" style={{ borderColor: "var(--line)" }} />
                      </div>
                      <div>
                        <label className="text-xs mono-font" style={{ color: "var(--moss-light)" }}>Duration (min)</label>
                        <input type="number" min="0" value={sDuration} onChange={(e) => setSDuration(e.target.value)} placeholder="e.g. 5"
                          className="w-full px-2 py-1.5 rounded border text-sm mt-1" style={{ borderColor: "var(--line)" }} />
                      </div>
                      <div>
                        <label className="text-xs mono-font" style={{ color: "var(--moss-light)" }}>Distraction</label>
                        <select value={sDistraction} onChange={(e) => setSDistraction(e.target.value)}
                          className="w-full px-2 py-1.5 rounded border text-sm mt-1" style={{ borderColor: "var(--line)" }}>
                          <option value="">—</option>
                          <option value="None">None</option>
                          <option value="Low">Low</option>
                          <option value="Medium">Medium</option>
                          <option value="High">High</option>
                        </select>
                      </div>
                      <div>
                        <label className="text-xs mono-font" style={{ color: "var(--moss-light)" }}>Reps</label>
                        <input type="number" min="0" value={sReps} onChange={(e) => setSReps(e.target.value)} placeholder="e.g. 12"
                          className="w-full px-2 py-1.5 rounded border text-sm mt-1" style={{ borderColor: "var(--line)" }} />
                      </div>
                      <div>
                        <label className="text-xs mono-font" style={{ color: "var(--moss-light)" }}>Reinforcements given</label>
                        <input type="number" min="0" value={sReinforcements} onChange={(e) => setSReinforcements(e.target.value)} placeholder="e.g. 10"
                          className="w-full px-2 py-1.5 rounded border text-sm mt-1" style={{ borderColor: "var(--line)" }} />
                      </div>
                    </div>

                    <label className="text-xs mono-font" style={{ color: "var(--moss-light)" }}>Video link</label>
                    <input type="text" value={sVideo} onChange={(e) => setSVideo(e.target.value)} placeholder="Paste a shareable link (e.g. Google Photos, Drive, YouTube)"
                      className="w-full px-3 py-2 rounded border text-sm mt-1 mb-1" style={{ borderColor: "var(--line)" }} />
                    <p className="text-xs mb-2" style={{ color: "var(--moss-light)" }}>This tool doesn't store video files directly — paste a link to a clip you've uploaded elsewhere.</p>
                    <label className="text-xs mono-font" style={{ color: "var(--moss-light)" }}>Or, where is it stored? (optional)</label>
                    <input type="text" value={sVideoNote} onChange={(e) => setSVideoNote(e.target.value)} placeholder="e.g. Phone Photos app, 'Albert training' album"
                      className="w-full px-3 py-2 rounded border text-sm mt-1 mb-3" style={{ borderColor: "var(--line)" }} />
                    <label className="text-xs mono-font" style={{ color: "var(--moss-light)" }}>Learning points / takeaways for next time</label>
                    <textarea value={sTakeaways} onChange={(e) => setSTakeaways(e.target.value)} placeholder="What to try, adjust, or repeat next session..." rows={2}
                      className="w-full px-3 py-2 rounded border text-sm mt-1 mb-3" style={{ borderColor: "var(--line)" }} />
                    <div className="flex gap-2">
                      <button onClick={saveSession} className="px-4 py-1.5 rounded text-sm text-white" style={{ background: "var(--moss)" }}>
                        <Check size={13} className="inline mr-1" /> Save session
                      </button>
                      <button onClick={resetSessionForm} className="px-4 py-1.5 rounded text-sm" style={{ color: "var(--moss-light)" }}>Cancel</button>
                    </div>
                  </div>
                )}

                {dogSessions.length === 0 && !showSessionForm && (
                  <div className="text-center py-14 rounded-lg" style={{ border: "1px dashed var(--line)" }}>
                    <MapPin size={26} className="mx-auto mb-3" style={{ color: "var(--moss-light)" }} />
                    <p className="display-font text-lg" style={{ color: "var(--ink)" }}>No sessions logged yet</p>
                    <p className="text-sm mt-1" style={{ color: "var(--moss-light)" }}>Your log starts with the first one.</p>
                  </div>
                )}

                {dogSessions.length > 0 && (
                  <ol className="relative ml-3">
                    <div className="absolute left-[7px] top-2 bottom-2 border-l-2 border-dashed" style={{ borderColor: "var(--moss-light)" }} />
                    {dogSessions.map((s) => {
                      const waypointNum = dogSessionsAsc.findIndex((x) => x.id === s.id) + 1;
                      const linkedGoal = goals.find((g) => g.id === s.goalId);
                      const isOpen = expandedSession === s.id;
                      return (
                        <li key={s.id} className="relative pl-7 pb-5">
                          <span className="absolute left-0 top-0.5 w-4 h-4 rounded-full flex items-center justify-center text-[9px] mono-font text-white" style={{ background: "var(--rust)" }}>{waypointNum}</span>
                          <div className="rounded-lg p-3" style={{ background: "var(--paper-card)", border: "1px solid var(--line)" }}>
                            <button className="w-full flex items-center justify-between text-left" onClick={() => setExpandedSession(isOpen ? null : s.id)}>
                              <div>
                                <span className="mono-font text-xs" style={{ color: "var(--teal)" }}>{fmtDate(s.date)}</span>
                                {linkedGoal && <span className="ml-2 text-xs" style={{ color: "var(--moss-light)" }}>→ {linkedGoal.title}</span>}
                              </div>
                              {isOpen ? <ChevronUp size={16} /> : <ChevronDown size={16} />}
                            </button>
                            {isOpen && (
                              <div className="mt-2 space-y-2">
                                {s.successCriteria && (
                                  <div className="p-2 rounded" style={{ background: "#fff", border: "1.5px solid var(--rust)" }}>
                                    <p className="text-xs mono-font uppercase tracking-wide" style={{ color: "var(--rust)" }}>Success criteria</p>
                                    <p className="text-sm mt-0.5" style={{ color: "var(--ink)" }}>{s.successCriteria}</p>
                                  </div>
                                )}
                                {s.notes && (<div><p className="text-xs mono-font" style={{ color: "var(--moss-light)" }}>Notes</p><p className="text-sm" style={{ color: "var(--ink)" }}>{s.notes}</p></div>)}
                                {(s.distance || s.duration || s.distraction || s.reps || s.reinforcements) && (
                                  <div>
                                    <p className="text-xs mono-font" style={{ color: "var(--moss-light)" }}>Criteria &amp; rate</p>
                                    <div className="flex flex-wrap gap-1.5 mt-1">
                                      {s.distance && <span className="text-xs px-2 py-0.5 rounded-full" style={{ background: "#fff", border: "1px solid var(--line)", color: "var(--ink)" }}>Distance: {s.distance}</span>}
                                      {s.duration && <span className="text-xs px-2 py-0.5 rounded-full" style={{ background: "#fff", border: "1px solid var(--line)", color: "var(--ink)" }}>Duration: {s.duration} min</span>}
                                      {s.distraction && <span className="text-xs px-2 py-0.5 rounded-full" style={{ background: "#fff", border: "1px solid var(--line)", color: "var(--ink)" }}>Distraction: {s.distraction}</span>}
                                      {s.reps && <span className="text-xs px-2 py-0.5 rounded-full" style={{ background: "#fff", border: "1px solid var(--line)", color: "var(--ink)" }}>Reps: {s.reps}</span>}
                                      {s.reinforcements && <span className="text-xs px-2 py-0.5 rounded-full" style={{ background: "#fff", border: "1px solid var(--line)", color: "var(--ink)" }}>Reinforced: {s.reinforcements}</span>}
                                      {s.reinforcements && s.duration && Number(s.duration) > 0 && (
                                        <span className="text-xs px-2 py-0.5 rounded-full" style={{ background: "var(--moss)", color: "#fff" }}>ROR: {(Number(s.reinforcements) / Number(s.duration)).toFixed(1)}/min</span>
                                      )}
                                    </div>
                                  </div>
                                )}
                                {(s.videoUrl || s.videoNote) && (
                                  <div>
                                    <p className="text-xs mono-font" style={{ color: "var(--moss-light)" }}>Clip</p>
                                    {s.videoUrl && (
                                      <a href={s.videoUrl} target="_blank" rel="noopener noreferrer" className="text-sm flex items-center gap-1 underline" style={{ color: "var(--teal)" }}>
                                        <Video size={13} /> View video
                                      </a>
                                    )}
                                    {s.videoNote && (
                                      <p className="text-sm flex items-center gap-1" style={{ color: "var(--ink)" }}>
                                        <Video size={13} style={{ color: "var(--moss-light)" }} /> {s.videoNote}
                                      </p>
                                    )}
                                  </div>
                                )}
                                {s.takeaways && (<div><p className="text-xs mono-font" style={{ color: "var(--moss-light)" }}>Takeaways for next time</p><p className="text-sm" style={{ color: "var(--ink)" }}>{s.takeaways}</p></div>)}
                                <div className="flex gap-3 pt-1">
                                  <button onClick={() => openEditSession(s)} className="text-xs flex items-center gap-1" style={{ color: "var(--teal)" }}><Pencil size={12} /> Edit</button>
                                  <button onClick={() => deleteSession(s.id)} className="text-xs flex items-center gap-1" style={{ color: "var(--rust)" }}><Trash2 size={12} /> Delete</button>
                                </div>
                              </div>
                            )}
                          </div>
                        </li>
                      );
                    })}
                  </ol>
                )}
              </div>
            )}
          </React.Fragment>
        )}

        {storageError && <p className="text-xs mt-8 text-center" style={{ color: "var(--rust)" }}>Couldn't save changes just now — check your connection and try again.</p>}
      </main>
    </div>
  );
}

function Root() {
  const [session, setSession] = useState(undefined);

  useEffect(() => {
    supabase.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: sub } = supabase.auth.onAuthStateChange((_event, s) => setSession(s));
    return () => sub.subscription.unsubscribe();
  }, []);

  if (session === undefined) {
    return <div className="max-w-sm mx-auto px-5 pt-24 text-sm" style={{ color: "var(--moss-light)" }}>Loading…</div>;
  }
  if (!session) {
    return <AuthScreen onSignedIn={setSession} />;
  }
  return <TrainingLogApp session={session} onSignOut={() => supabase.auth.signOut()} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
</script>
</body>
</html>
